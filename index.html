<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.app">Snake Tutor</title>
  <meta name="description" content="Step through a Python script line by line, right in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E">
  <!-- Must load first: adds the cross-origin isolation headers GitHub Pages cannot send. -->
  <script src="coi-serviceworker.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.21/mode/python/python.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="layout" id="layout">
    <!-- Left: the script -->
    <section class="pane script-pane" aria-label="Script" data-i18n-aria-label="pane.script">
      <header class="pane-header">
        <span class="brand">🐍 <span data-i18n="title.app">Snake Tutor</span></span>
        <span class="file-name" id="file-name">main.py</span>
        <span class="spacer"></span>
        <label class="lang">
          <span class="visually-hidden" data-i18n="lang.label">Language</span>
          <select id="lang-select" data-i18n-title="lang.label"></select>
        </label>
        <a id="lang-report" class="lang-report" target="_blank" rel="noopener noreferrer" hidden
           data-i18n="lang.report" data-i18n-title="lang.reportTitle"
           title="Opens GitHub in a new tab — you need a GitHub account to report">Report a translation problem</a>
        <label class="btn btn-quiet" title="Open a .py file from your computer" data-i18n-title="file.openTitle">
          <span data-i18n="file.open">Open…</span><input type="file" id="file-input" accept=".py,text/x-python,text/plain" hidden>
        </label>
        <button class="btn btn-quiet" id="btn-download" type="button" title="Save this script as a .py file" data-i18n-title="file.downloadTitle" data-i18n="file.download">Download</button>
        <button class="btn btn-quiet" id="btn-sample" type="button" title="Replace the script with the example" data-i18n-title="file.exampleTitle" data-i18n="file.example">Example</button>
      </header>
      <div class="editor" id="editor"></div>
      <div class="drop-hint" id="drop-hint" data-i18n="file.dropHint">Drop your .py file here</div>
    </section>

    <div class="splitter splitter-v" id="split-v" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize" data-i18n-title="layout.resize"></div>

    <!-- Right: controls / console / variables -->
    <section class="pane side" id="side">
      <div class="panel controls" aria-label="Debug controls" data-i18n-aria-label="controls.label">
        <div class="toolbar" role="toolbar">
          <button class="btn btn-primary" id="btn-continue" type="button" title="Start (F5)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span id="continue-label">Start</span>
          </button>
          <button class="btn" id="btn-over" type="button" title="Step Over (F10) — run this line" data-i18n-title="controls.stepOverTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9a6 6 0 0 1 11-3.3V3h1.5v5h-5V6.5h2.4A4.5 4.5 0 0 0 3.5 9z"/><circle cx="8" cy="12.5" r="1.7"/></svg><span data-i18n="controls.stepOver">Step Over</span>
          </button>
          <button class="btn" id="btn-into" type="button" title="Step Into (F11) — go inside the function" data-i18n-title="controls.stepIntoTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7.25 1h1.5v6.1l2.2-2.2 1.06 1.06L8 10 3.99 5.96l1.06-1.06 2.2 2.2z"/><circle cx="8" cy="13" r="1.7"/></svg><span data-i18n="controls.stepInto">Step Into</span>
          </button>
          <button class="btn" id="btn-out" type="button" title="Step Out (Shift+F11) — finish this function" data-i18n-title="controls.stepOutTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8.75 10h-1.5V3.9L5.05 6.1 3.99 5.04 8 1l4.01 4.04-1.06 1.06-2.2-2.2z"/><circle cx="8" cy="13" r="1.7"/></svg><span data-i18n="controls.stepOut">Step Out</span>
          </button>
          <button class="btn" id="btn-restart" type="button" title="Restart (Ctrl/Cmd+Shift+F5)" data-i18n-title="controls.restartTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5A5.5 5.5 0 1 0 13.5 8H12a4 4 0 1 1-1.2-2.85L9 7h4.5V2.5l-1.6 1.6A5.48 5.48 0 0 0 8 2.5z"/></svg><span data-i18n="controls.restart">Restart</span>
          </button>
          <button class="btn btn-danger" id="btn-stop" type="button" title="Stop (Shift+F5)" data-i18n-title="controls.stopTitle">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg><span data-i18n="controls.stop">Stop</span>
          </button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Loading…</div>
        <div class="visually-hidden" id="lang-announce" role="status" aria-live="polite"></div>
      </div>

      <div class="panel console-panel">
        <h2 class="panel-title" data-i18n="console.title">Console</h2>
        <div class="console" id="console" aria-label="Console output" data-i18n-aria-label="console.outputLabel"></div>
      </div>

      <div class="splitter splitter-h" id="split-h" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to resize" data-i18n-title="layout.resize"></div>

      <div class="panel variables-panel">
        <h2 class="panel-title" data-i18n="vars.title">Memory</h2>
        <div class="variables" id="variables"></div>
      </div>
    </section>
  </main>

  <div class="blocker" id="blocker" hidden>
    <div class="blocker-card">
      <h2 data-i18n="blocker.title">Snake Tutor can't start in this browser window</h2>
      <p id="blocker-text"></p>
      <button class="btn btn-primary" type="button" onclick="location.reload()" data-i18n="blocker.reload">Reload</button>
    </div>
  </div>
</body>
</html>
